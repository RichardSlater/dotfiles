---
- name: Inspect existing nvm checkout
  ansible.builtin.stat:
    path: "{{ nvm_dir }}/nvm.sh"
    follow: false
  register: nvm_script

- name: Read existing nvm commit
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ nvm_dir }}"
      - rev-parse
      - HEAD
  register: nvm_existing_commit
  changed_when: false
  failed_when: false
  when: nvm_script.stat.exists

- name: Check existing nvm tracked state
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ nvm_dir }}"
      - status
      - --porcelain
      - --untracked-files=no
  register: nvm_existing_status
  changed_when: false
  failed_when: false
  when: nvm_script.stat.exists

- name: Refuse to execute a modified nvm checkout
  ansible.builtin.assert:
    that:
      - nvm_existing_commit.rc == 0
      - nvm_existing_status.rc == 0
      - (nvm_existing_status.stdout | trim) == ""
    fail_msg: >-
      Refusing to execute or update the existing nvm checkout because its Git
      identity could not be verified or tracked files have local modifications.
  when: nvm_script.stat.exists

- name: Check installed nvm version
  ansible.builtin.shell: |
    . "{{ nvm_dir }}/nvm.sh"
    nvm --version
  args:
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ nvm_dir }}"
  register: nvm_check
  changed_when: false
  failed_when: false
  when:
    - nvm_script.stat.exists
    - (nvm_existing_commit.stdout | trim) == nvm_ref

- name: Decide whether nvm needs installation
  ansible.builtin.set_fact:
    nvm_needs_install: >-
      {{ true if not nvm_script.stat.exists
         or (nvm_existing_commit.stdout | default('') | trim) != nvm_ref
         else (nvm_check.rc != 0
               or (nvm_version | regex_replace('^v', '')) not in nvm_check.stdout) }}

- name: Download nvm installer
  ansible.builtin.get_url:
    url: "{{ nvm_install_url }}"
    dest: "/tmp/nvm_install.sh"
    mode: "0755"
    checksum: "{{ nvm_install_checksum }}"
  when: nvm_needs_install

- name: Install nvm
  ansible.builtin.command: /tmp/nvm_install.sh
  environment:
    NVM_DIR: "{{ nvm_dir }}"
  register: nvm_install_result
  changed_when: nvm_install_result.rc == 0
  when: nvm_needs_install

- name: Remove nvm installer
  ansible.builtin.file:
    path: "/tmp/nvm_install.sh"
    state: absent
  when: nvm_needs_install

- name: Read installed nvm commit
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ nvm_dir }}"
      - rev-parse
      - HEAD
  register: nvm_installed_commit
  changed_when: false
  failed_when: false

- name: Check installed nvm tracked state
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ nvm_dir }}"
      - status
      - --porcelain
      - --untracked-files=no
  register: nvm_installed_status
  changed_when: false
  failed_when: false

- name: Verify installed nvm checkout
  ansible.builtin.assert:
    that:
      - nvm_installed_commit.rc == 0
      - (nvm_installed_commit.stdout | trim) == nvm_ref
      - nvm_installed_status.rc == 0
      - (nvm_installed_status.stdout | trim) == ""
    fail_msg: >-
      Refusing to use nvm because {{ nvm_version }} did not resolve to the
      expected clean commit {{ nvm_ref }}.

- name: Check selected Node.js runtime
  ansible.builtin.command: "{{ nvm_node_executable }} --version"
  register: nvm_node_check
  changed_when: false
  failed_when: false

- name: Check selected npm runtime
  ansible.builtin.command: "{{ nvm_npm_executable }} --version"
  environment:
    PATH: "{{ nvm_node_bin }}:{{ ansible_facts['env'].PATH }}"
  register: nvm_npm_check
  changed_when: false
  failed_when: false

- name: Install selected Node.js LTS with nvm
  ansible.builtin.shell: |
    . "{{ nvm_dir }}/nvm.sh"
    nvm install "{{ nvm_node_version }}"
  args:
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ nvm_dir }}"
  when:
    - nvm_node_check.rc != 0 or (nvm_node_check.stdout | trim) != nvm_node_version or nvm_npm_check.rc != 0
  register: nvm_node_install
  changed_when: nvm_node_install.rc == 0

- name: Verify selected Node.js runtime
  ansible.builtin.command: "{{ nvm_node_executable }} --version"
  register: nvm_node_verify
  changed_when: false
  failed_when: false

- name: Verify selected npm runtime
  ansible.builtin.command: "{{ nvm_npm_executable }} --version"
  environment:
    PATH: "{{ nvm_node_bin }}:{{ ansible_facts['env'].PATH }}"
  register: nvm_npm_verify
  changed_when: false
  failed_when: false

- name: Assert the nvm-managed Node.js/npm runtime is available
  ansible.builtin.assert:
    that:
      - nvm_node_verify.rc == 0
      - (nvm_node_verify.stdout | trim) == nvm_node_version
      - nvm_npm_verify.rc == 0
    fail_msg: >-
      Expected nvm-managed Node.js {{ nvm_node_version }} and npm are unavailable.
      Expected Node at {{ nvm_node_executable }} and npm at {{ nvm_npm_executable }}.
      Ensure the nvm install completed successfully and rerun this role; do not use an OS Node/npm package.
    success_msg: >-
      nvm-managed Node.js {{ nvm_node_version }} and npm are available at
      {{ nvm_node_executable }} and {{ nvm_npm_executable }}.
