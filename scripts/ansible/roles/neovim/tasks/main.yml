---
- name: Install dependencies for Neovim build
  ansible.builtin.apt:
    name:
      - ninja-build
      - gettext
      - cmake
      - unzip
      - curl
      - git
      - build-essential
      - pkg-config
      - libtool
      - automake
      - g++
      - libncurses5-dev
      - libncursesw5-dev
      - libclang-dev
    state: present
    update_cache: true

- name: Install Yarn via apt
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Yarn
      ansible.builtin.apt:
        name: yarnpkg
        state: present

- name: Check if Neovim is already installed
  ansible.builtin.command: nvim --version
  register: neovim_installed
  changed_when: false
  failed_when: false

- name: Clone Neovim repository
  ansible.builtin.git:
    repo: "{{ neovim_repo }}"
    dest: "{{ neovim_dest }}"
    depth: 1
    version: "{{ neovim_version }}"
    update: true
    # Ensure a stale local tag cannot block this immutable commit checkout.
    force: true
  register: neovim_git

- name: Read checked-out Neovim commit
  ansible.builtin.command:
    argv:
      - git
      - rev-parse
      - HEAD
  args:
    chdir: "{{ neovim_dest }}"
  register: neovim_checked_out_commit
  changed_when: false

- name: Verify checked-out Neovim commit
  ansible.builtin.assert:
    that:
      - (neovim_checked_out_commit.stdout | trim) == neovim_ref
    fail_msg: >-
      Refusing to build Neovim because {{ neovim_version }} resolved to an
      unexpected commit.

- name: Check Neovim clean startup
  ansible.builtin.command: nvim --clean --headless +qa
  register: neovim_clean_startup
  changed_when: false
  failed_when: false

- name: Decide whether Neovim needs a rebuild
  ansible.builtin.set_fact:
    neovim_source_changed: "{{ neovim_git.changed }}"
    neovim_needs_build: >-
      {{ neovim_git.changed or neovim_installed.rc != 0
         or neovim_clean_startup.rc != 0
         or (neovim_clean_startup.stderr | length > 0) }}

- name: Clean Neovim build directory if source changed
  ansible.builtin.command:
    cmd: "make distclean"
    chdir: "{{ neovim_dest }}"
  when: neovim_source_changed
  changed_when: neovim_distclean.rc == 0
  register: neovim_distclean
  failed_when: false

- name: Build Neovim
  ansible.builtin.command:
    cmd: "make CMAKE_BUILD_TYPE=Release"
    chdir: "{{ neovim_dest }}"
  register: neovim_build
  when: neovim_needs_build
  changed_when: neovim_build.rc == 0
  failed_when: false

- name: Clean and retry build if failed (stale cache)
  when:
    - neovim_needs_build
    - neovim_build.rc != 0
  block:
    - name: Clean stale build directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ neovim_dest }}/.deps"
        - "{{ neovim_dest }}/build"

    - name: Retry Neovim build
      ansible.builtin.command:
        cmd: "make CMAKE_BUILD_TYPE=Release"
        chdir: "{{ neovim_dest }}"
      register: neovim_retry_build
      changed_when: neovim_retry_build.rc == 0

- name: Install Neovim with runtime rollback
  when: neovim_needs_build
  block:
    - name: Inspect installed Neovim runtime
      ansible.builtin.stat:
        path: "{{ neovim_install_dir }}/share/nvim/runtime"
        follow: false
      register: neovim_runtime_before

    - name: Inspect Neovim runtime recovery path
      ansible.builtin.stat:
        path: "{{ neovim_install_dir }}/share/nvim/runtime.ansible-backup"
        follow: false
      register: neovim_runtime_backup

    - name: Ensure Neovim runtime recovery path is available
      ansible.builtin.assert:
        that:
          - not neovim_runtime_backup.stat.exists
        fail_msg: >-
          Refusing to replace the Neovim runtime because the recovery path
          already exists.

    - name: Preserve installed Neovim runtime
      ansible.builtin.command:
        argv:
          - mv
          - "{{ neovim_install_dir }}/share/nvim/runtime"
          - "{{ neovim_install_dir }}/share/nvim/runtime.ansible-backup"
      become: true
      register: neovim_preserve_runtime
      when: neovim_runtime_before.stat.exists
      changed_when: true

    - name: Install Neovim
      ansible.builtin.command:
        cmd: "make install"
        chdir: "{{ neovim_dest }}"
      become: true
      changed_when: neovim_install.rc == 0
      register: neovim_install

    - name: Verify newly installed Neovim runtime
      ansible.builtin.command: nvim --clean --headless +qa
      register: neovim_install_startup
      changed_when: false
      failed_when: >-
        neovim_install_startup.rc != 0
        or (neovim_install_startup.stderr | length > 0)

    - name: Remove preserved Neovim runtime
      ansible.builtin.file:
        path: "{{ neovim_install_dir }}/share/nvim/runtime.ansible-backup"
        state: absent
      become: true
      when: neovim_runtime_before.stat.exists

  rescue:
    - name: Remove failed Neovim runtime
      ansible.builtin.file:
        path: "{{ neovim_install_dir }}/share/nvim/runtime"
        state: absent
      become: true
      when: neovim_install is defined

    - name: Restore preserved Neovim runtime
      ansible.builtin.command:
        argv:
          - mv
          - "{{ neovim_install_dir }}/share/nvim/runtime.ansible-backup"
          - "{{ neovim_install_dir }}/share/nvim/runtime"
      become: true
      when:
        - neovim_preserve_runtime is defined
        - neovim_preserve_runtime.rc == 0
      changed_when: true

    - name: Report Neovim installation failure
      ansible.builtin.fail:
        msg: >-
          Neovim installation or clean-start verification failed. The previous
          runtime was restored when one was present.

- name: Verify Neovim clean startup
  ansible.builtin.command: nvim --clean --headless +qa
  register: neovim_clean_startup_result
  changed_when: false
  failed_when: >-
    neovim_clean_startup_result.rc != 0
    or (neovim_clean_startup_result.stderr | length > 0)

- name: Verify Neovim installation
  ansible.builtin.command: "nvim --version"
  register: neovim_version_result
  changed_when: false

- name: Show installed Neovim version
  ansible.builtin.debug:
    msg: "{{ neovim_version_result.stdout }}"
