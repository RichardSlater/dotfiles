---
- name: Install dependencies for fzf
  become: true
  apt:
    name:
      - git
      - build-essential
      - curl
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Clone fzf repository
  git:
    repo: "https://github.com/junegunn/fzf.git"
    dest: "{{ fzf_install_dir }}"
    version: "{{ fzf_version }}"
    depth: 1
    update: true
  register: fzf_clone
  when: not ansible_check_mode

- name: Check whether fzf is installed
  stat:
    path: "{{ fzf_install_dir }}/bin/fzf"
  register: fzf_binary

- name: Build and install fzf
  command:
    cmd: "./install --all"
    chdir: "{{ fzf_install_dir }}"
  when:
    - not ansible_check_mode
    - fzf_clone.changed or not fzf_binary.stat.exists

- name: Ensure fzf is available globally
  become: true
  file:
    src: "{{ fzf_install_dir }}/bin/fzf"
    dest: "/usr/local/bin/fzf"
    state: link
    # Replace a stale plain file so /usr/local/bin remains the canonical override path.
    force: true
  when: not ansible_check_mode
