---
- name: Remove distribution Podman packages
  become: true
  apt:
    name:
      - podman
      - podman-docker
    state: absent
    purge: true

- name: Install system and build dependencies for Podman
  apt:
    name:
      - uidmap
      - iptables
      - ca-certificates
      - curl
      - fuse-overlayfs
      - libseccomp2
      - conmon
      - catatonit
      - netavark
      - aardvark-dns
      - btrfs-progs
      - gcc
      - git
      - go-md2man
      - libassuan-dev
      - libbtrfs-dev
      - libc6-dev
      - libdevmapper-dev
      - libglib2.0-dev
      - libgpgme-dev
      - libgpg-error-dev
      - libprotobuf-dev
      - libprotobuf-c-dev
      - libseccomp-dev
      - libselinux1-dev
      - libsystemd-dev
      - make
      - pkg-config
      - "{{ podman_package_map[podman_network_handler] }}"
      - "{{ podman_package_map[podman_runtime] }}"
    state: present
    update_cache: true

- name: Create containers configuration directory
  become: true
  file:
    path: /etc/containers
    state: directory
    mode: '0755'

# containers/image does not publish individual file checksums. The reviewed
# full commit in these TLS URLs is the documented integrity boundary.
- name: Install reviewed container-image configuration with rollback
  become: true
  block:
    - name: Create a staging directory for container-image configuration
      ansible.builtin.tempfile:
        state: directory
        suffix: container_image
      register: podman_container_image_stage

    - name: Download immutable default policy configuration
      ansible.builtin.get_url:
        url: "{{ podman_policy_source_url }}"
        dest: "{{ podman_container_image_stage.path }}/policy.json"
        mode: '0600'

    - name: Download immutable registries configuration
      ansible.builtin.get_url:
        url: "{{ podman_registries_source_url }}"
        dest: "{{ podman_container_image_stage.path }}/registries.conf"
        mode: '0600'

    - name: Validate downloaded default policy JSON
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - json.tool
          - "{{ podman_container_image_stage.path }}/policy.json"
      changed_when: false

    - name: Check downloaded registries configuration is non-empty
      ansible.builtin.stat:
        path: "{{ podman_container_image_stage.path }}/registries.conf"
      register: podman_downloaded_registries

    - name: Reject an empty downloaded registries configuration
      ansible.builtin.assert:
        that:
          - podman_downloaded_registries.stat.size > 0

    - name: Inspect managed Podman configurations and recovery paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /etc/containers/policy.json
        - /etc/containers/registries.conf
        - /etc/containers/policy.json.ansible-backup
        - /etc/containers/registries.conf.ansible-backup
      register: podman_configuration_paths

    - name: Refuse to overwrite Podman configuration recovery paths
      ansible.builtin.assert:
        that:
          - not (podman_configuration_paths.results | selectattr('item', 'equalto', item) | map(attribute='stat.exists') | first)
        fail_msg: "Refusing to overwrite existing recovery path {{ item }}."
      loop:
        - /etc/containers/policy.json.ansible-backup
        - /etc/containers/registries.conf.ansible-backup

    - name: Preserve existing default policy configuration
      ansible.builtin.copy:
        src: /etc/containers/policy.json
        dest: /etc/containers/policy.json.ansible-backup
        remote_src: true
        mode: '0600'
      when: podman_configuration_paths.results[0].stat.exists
      register: podman_policy_backup

    - name: Preserve existing registries configuration
      ansible.builtin.copy:
        src: /etc/containers/registries.conf
        dest: /etc/containers/registries.conf.ansible-backup
        remote_src: true
        mode: '0600'
      when: podman_configuration_paths.results[1].stat.exists
      register: podman_registries_backup

    - name: Install reviewed default policy configuration
      ansible.builtin.copy:
        src: "{{ podman_container_image_stage.path }}/policy.json"
        dest: /etc/containers/policy.json
        remote_src: true
        mode: '0644'
      register: podman_policy_install

    - name: Install reviewed registries configuration
      ansible.builtin.copy:
        src: "{{ podman_container_image_stage.path }}/registries.conf"
        dest: /etc/containers/registries.conf
        remote_src: true
        mode: '0644'
      register: podman_registries_install

    - name: Remove Podman configuration recovery paths after success
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/containers/policy.json.ansible-backup
        - /etc/containers/registries.conf.ansible-backup

  rescue:
    - name: Remove failed default policy configuration
      ansible.builtin.file:
        path: /etc/containers/policy.json
        state: absent
      when:
        - podman_policy_install is defined
        - not podman_configuration_paths.results[0].stat.exists

    - name: Restore preserved default policy configuration
      ansible.builtin.command:
        argv:
          - mv
          - /etc/containers/policy.json.ansible-backup
          - /etc/containers/policy.json
      when:
        - podman_policy_backup is defined
        - podman_policy_backup.changed
      changed_when: true

    - name: Remove failed registries configuration
      ansible.builtin.file:
        path: /etc/containers/registries.conf
        state: absent
      when:
        - podman_registries_install is defined
        - not podman_configuration_paths.results[1].stat.exists

    - name: Restore preserved registries configuration
      ansible.builtin.command:
        argv:
          - mv
          - /etc/containers/registries.conf.ansible-backup
          - /etc/containers/registries.conf
      when:
        - podman_registries_backup is defined
        - podman_registries_backup.changed
      changed_when: true

    - name: Report Podman configuration installation failure
      ansible.builtin.fail:
        msg: >-
          Podman configuration download or validation failed. Existing
          configuration was restored when it was present.

  always:
    - name: Remove staged container-image configuration
      ansible.builtin.file:
        path: "{{ podman_container_image_stage.path }}"
        state: absent
      when: podman_container_image_stage is defined

- name: Check if Podman is already installed and matches version
  command: podman --version
  register: podman_current_version
  failed_when: false
  changed_when: false

- name: Normalize expected Podman version for runtime checks
  set_fact:
    podman_expected_version: "{{ podman_version | regex_replace('^v', '') }}"

- name: Create build directory
  file:
    path: "{{ podman_build_dir }}"
    state: directory
  when: podman_current_version.rc != 0 or podman_expected_version not in podman_current_version.stdout

- name: Clone Podman repository
  git:
    repo: "{{ podman_git_repo }}"
    dest: "{{ podman_build_dir }}"
    version: "{{ podman_version }}"
    depth: 1
    update: true
  when: podman_current_version.rc != 0 or podman_expected_version not in podman_current_version.stdout

- name: Build and Install Podman from source
  become: true
  shell: |
    export PATH=$PATH:/usr/local/go/bin
    make BUILDTAGS="{{ podman_build_tags }}" PREFIX=/usr/local
    make install PREFIX=/usr/local
  args:
    chdir: "{{ podman_build_dir }}"
    executable: /bin/bash
  when: podman_current_version.rc != 0 or podman_expected_version not in podman_current_version.stdout
  register: podman_build_result

- name: Install Docker-compatible Podman wrapper
  become: true
  copy:
    dest: /usr/local/bin/docker
    mode: '0755'
    content: |
      #!/bin/sh
      exec /usr/local/bin/podman "$@"

- name: Get information for {{ podman_user }}
  getent:
    key: "{{ podman_user }}"
    database: passwd

- name: Set home directory for {{ podman_user }}
  set_fact:
    podman_user_home: "{{ getent_passwd[podman_user][4] }}"

- name: Ensure /etc/subuid and /etc/subgid are configured for {{ podman_user }}
  become: true
  block:
    - name: Add user to /etc/subuid
      lineinfile:
        path: /etc/subuid
        regexp: '^{{ podman_user }}:'
        line: "{{ podman_user }}:100000:65536"
        create: true

    - name: Add user to /etc/subgid
      lineinfile:
        path: /etc/subgid
        regexp: '^{{ podman_user }}:'
        line: "{{ podman_user }}:100000:65536"
        create: true

- name: Check if unprivileged user namespaces sysctl exists
  stat:
    path: /proc/sys/kernel/unprivileged_userns_clone
  register: userns_sysctl_stat

- name: Enable unprivileged user namespaces
  become: true
  sysctl:
    name: kernel.unprivileged_userns_clone
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/userns.conf
  when: userns_sysctl_stat.stat.exists

- name: Create Podman configuration directory
  file:
    path: "{{ podman_user_home }}/.config/containers"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: '0755'

- name: Configure Podman to use {{ podman_network_handler }} and {{ podman_runtime }}
  copy:
    dest: "{{ podman_user_home }}/.config/containers/containers.conf"
    content: |
      [containers]
      netns = "{{ podman_network_handler }}"
      runtime = "{{ podman_runtime }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: '0644'

- name: Ensure Podman uses iptables firewall on WSL
  become: true
  become_user: "{{ podman_user }}"
  ini_file:
    path: "{{ podman_user_home }}/.config/containers/containers.conf"
    section: network
    option: firewall_driver
    value: '"iptables"'
  when: ansible_virtualization_type == "wsl"

- name: Verify Podman installation
  command: podman --version
  register: podman_verify
  changed_when: false

- name: Show Podman version
  debug:
    msg: "Podman installed: {{ podman_verify.stdout }}"
