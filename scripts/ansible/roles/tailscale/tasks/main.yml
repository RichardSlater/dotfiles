---
- name: Install Tailscale client
  block:
    - name: Validate supported Tailscale package distribution
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
        fail_msg: >-
          Tailscale's package repository is configured only for Debian and Ubuntu.

    - name: Install Tailscale archive signing key
      ansible.builtin.get_url:
        url: >-
          https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: '0644'

    - name: Configure Tailscale stable package repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
          https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}
          {{ ansible_facts['distribution_release'] }} main
        filename: tailscale
        state: present
        update_cache: true

    - name: Install Tailscale client package
      ansible.builtin.apt:
        name: tailscale
        state: present

    - name: Enable and start Tailscale daemon
      ansible.builtin.service:
        name: tailscaled
        enabled: true
        state: started
  when: ansible_facts['os_family'] == 'Debian'
